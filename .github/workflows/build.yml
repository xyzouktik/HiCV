name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile cv.tex
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile with pdfLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: HiCV
          path: cv.pdf
          if-no-files-found: error
